name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing. There is no API token and no secret: PyPI verifies
      # this OIDC identity against the publisher configured on the project.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - run: pip install --upgrade build
      - run: pip install .
      - run: python -m unittest discover -s tests -v

      - run: python -m build
      # skip-existing so re-running a partially-failed release is harmless.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
