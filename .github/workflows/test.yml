name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 is the floor pyproject advertises and 3.14 is what the sandbox
        # runs. Testing only the sandbox's version would let the advertised
        # floor rot into a lie that nobody notices until an install fails.
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install .
      - run: python -m unittest discover -s tests -v
