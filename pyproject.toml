[project]
name = "outcometick"
version = "1.6.4"
description = "Strategy SDK for outcometick prediction-market backtests"
readme = "README.md"
# Deliberately looser than the sandbox, which pins 3.14.
#
# This package is the SDK SURFACE — the Strategy base class and the Order value
# object — so an editor and a type checker can see the API. Pinning it to the
# sandbox's runtime would stop anyone on 3.12 or 3.13 from installing even the
# type hints, which helps nobody: the strategy still has to run on 3.14, and
# that is checked server-side where it can actually be enforced.
requires-python = ">=3.10"
license = { text = "MIT" }

[project.urls]
Documentation = "https://outcometick.com/docs/sdk"
Source = "https://github.com/outcometick/outcometick-sdk-python"
Issues = "https://github.com/outcometick/outcometick-sdk-python/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["outcometick"]

[tool.setuptools.package-data]
outcometick = ["py.typed"]
