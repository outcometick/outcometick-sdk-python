[project]
name = "outcometick"
version = "2.3.1"
description = "Strategy SDK, data client and local backtester for Polymarket and Predict.fun"
readme = "README.md"
# Deliberately looser than the sandbox, which pins 3.14.
#
# The SDK surface (Strategy, Order), the data client and the local backtester
# all run on 3.10+, and pinning the package to the sandbox's runtime would stop
# anyone on 3.12 or 3.13 from backtesting locally at all. A strategy submitted
# to the queue still has to run on 3.14, and that is checked server-side where
# it can actually be enforced.
requires-python = ">=3.10"
license = { text = "MIT" }

[project.urls]
Documentation = "https://outcometick.com/docs/sdk"
Source = "https://github.com/outcometick/outcometick-sdk-python"
Issues = "https://github.com/outcometick/outcometick-sdk-python/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["outcometick", "outcometick.backtest", "outcometick.backtest._sandbox"]

[tool.setuptools.package-data]
outcometick = ["py.typed"]
"outcometick.backtest" = ["_contract.json"]
